{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NIDS Dashboard{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .text-muted {
            color: #94a3b8;
        }

        button,
        input,
        select {
            font-family: inherit;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}

</body>
</html>
