{% extends 'base.html' %}

{% block title %}
NIDS Login
{% endblock %}

{% block content %}

<div
    style="
        min-height:80vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px 20px;
    "
>

    <div
        class="card"
        style="
            width:100%;
            max-width:420px;
            padding:40px;
        "
    >

        <div style="text-align:center;">

            <h1
                style="
                    color:white;
                    font-size:32px;
                    margin-bottom:10px;
                "
            >
                NIDS
            </h1>

            <p
                style="
                    color:#94a3b8;
                    margin-bottom:30px;
                "
            >
                Network Intrusion Detection System
            </p>

        </div>


        {% if error %}

        <div
            style="
                background:#450a0a;
                border:1px solid #7f1d1d;
                color:#fca5a5;
                padding:12px;
                border-radius:6px;
                margin-bottom:20px;
                text-align:center;
            "
        >
            {{ error }}
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <!-- USERNAME -->

            <div style="margin-bottom:20px;">

                <label
                    style="
                        display:block;
                        color:#cbd5e1;
                        margin-bottom:8px;
                    "
                >
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                    style="
                        width:100%;
                        box-sizing:border-box;
                        padding:12px;
                        background:#0f172a;
                        border:1px solid #334155;
                        border-radius:6px;
                        color:white;
                        outline:none;
                    "
                >

            </div>


            <!-- PASSWORD -->

            <div style="margin-bottom:25px;">

                <label
                    style="
                        display:block;
                        color:#cbd5e1;
                        margin-bottom:8px;
                    "
                >
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                    style="
                        width:100%;
                        box-sizing:border-box;
                        padding:12px;
                        background:#0f172a;
                        border:1px solid #334155;
                        border-radius:6px;
                        color:white;
                        outline:none;
                    "
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                style="
                    width:100%;
                    padding:12px;
                    background:#38bdf8;
                    border:none;
                    border-radius:6px;
                    color:#0f172a;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                LOGIN
            </button>

        </form>


        <p
            style="
                text-align:center;
                color:#64748b;
                font-size:13px;
                margin-top:25px;
            "
        >
            Authorized administrators only
        </p>

    </div>

</div>

{% endblock %}
