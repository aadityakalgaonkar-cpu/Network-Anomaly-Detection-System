<header class="header">

    <div class="header-left">
        <span class="admin-name">
            Admin: {{ request.user.username }}
        </span>
    </div>

    <div class="header-right">

        <a href="{% url 'aboutus' %}" class="header-link">
            About Us
        </a>

        <form method="post" action="{% url 'logout' %}" class="logout-form">
    {% csrf_token %}
    <button type="submit" class="logout-button">
        Logout
    </button>
</form>

    </div>

</header>

<style>
    .header {
        width: 100%;
        height: 60px;
        background-color: #1e293b;
        border-bottom: 1px solid #334155;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 24px;
    }

    .header-left {
        display: flex;
        align-items: center;
    }

    .admin-name {
        font-size: 16px;
        font-weight: 500;
        color: #f8fafc;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    .header-link {
        font-size: 15px;
        color: #cbd5e1;
        text-decoration: none;
    }

    .header-link:hover {
        color: #38bdf8;
    }

    .logout-form {
        margin: 0;
    }

    .logout-button {
        background-color: transparent;
        border: 1px solid #475569;
        border-radius: 4px;

        padding: 7px 14px;

        font-size: 15px;
        color: #cbd5e1;
    }

    .logout-button:hover {
        background-color: #334155;
        color: #f8fafc;
    }
</style>
