<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Packets History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #38bdf8;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* REPORT BOX */

        .report-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 22px;
            margin-bottom: 30px;
        }

        .report-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .filter-group label {
            font-size: 13px;
            color: #cbd5e1;
        }

        input,
        select {
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 5px;
            padding: 9px 11px;
            min-width: 180px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        .report-button {
            margin-top: 20px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .report-button:hover {
            background-color: #0ea5e9;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1500px;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #334155;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #334155;
            color: #f8fafc;
            font-size: 14px;
        }

        td {
            color: #cbd5e1;
            font-size: 14px;
        }

        tr:hover td {
            background-color: #273449;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'history' %}" class="back-link">
        ← Back to History
    </a>

    <h1>All Packets History</h1>


    <!-- REPORT FILTER BOX -->

    <div class="report-box">

        <h2>Generate Report</h2>

        <form method="get" action="{% url 'packet_report' %}">

            <div class="filter-row">

                <div class="filter-group">
                    <label>Protocol</label>

                    <input
                        type="text"
                        name="protocol"
                        placeholder="TCP / UDP / ICMP"
                    >
                </div>

                <div class="filter-group">
                    <label>Direction</label>

                    <select name="direction">

                        <option value="">All</option>
                        <option value="INCOMING">INCOMING</option>
                        <option value="OUTGOING">OUTGOING</option>
                        <option value="LOCAL">LOCAL</option>
                        <option value="OTHER">OTHER</option>

                    </select>
                </div>

                <div class="filter-group">
                    <label>Source IP</label>

                    <input
                        type="text"
                        name="source_ip"
                        placeholder="192.168.1.10"
                    >
                </div>

                <div class="filter-group">
                    <label>Destination IP</label>

                    <input
                        type="text"
                        name="destination_ip"
                        placeholder="192.168.1.20"
                    >
                </div>

            </div>

            <button type="submit" class="report-button">
                DOWNLOAD CSV REPORT
            </button>

        </form>

    </div>


<!-- AUTO REFRESH EVERY 30 SECONDS -->

<script>
    setTimeout(function () {
        window.location.reload();
    }, 30000);
</script>

</body>
</html>
